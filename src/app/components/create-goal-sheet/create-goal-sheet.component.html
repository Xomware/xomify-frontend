<div class="sheet-overlay" (click)="close()">
  <div class="sheet" (click)="$event.stopPropagation()">
    <div class="sheet-header">
      <h3>Create Goal</h3>
      <button class="close-btn" (click)="close()">✕</button>
    </div>

    <div class="sheet-body">
      <label class="field-label">Goal Type</label>
      <select [(ngModel)]="selectedMetric" class="field-input">
        <option *ngFor="let m of metrics" [value]="m.value">{{ m.label }}</option>
      </select>

      <label class="field-label">Target</label>
      <input
        type="number"
        [(ngModel)]="target"
        min="1"
        class="field-input"
      />

      <div class="preview">
        <app-icon [name]="icon" [size]="20" class="preview-icon"></app-icon>
        <span class="preview-text">{{ preview }}</span>
      </div>
    </div>

    <p class="sheet-error" *ngIf="error" role="alert">{{ error }}</p>

    <button class="add-btn" (click)="addGoal()" [disabled]="saving">
      {{ saving ? 'Saving…' : 'Add Goal' }}
    </button>
  </div>
</div>
