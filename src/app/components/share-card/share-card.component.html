<article class="share-card" *ngIf="share">
  <!-- Header: author + time -->
  <header class="card-header">
    <button
      type="button"
      class="author"
      (click)="openAuthor()"
      [attr.aria-label]="'Open ' + authorLabel + '\'s profile'"
    >
      <div class="author-avatar" aria-hidden="true">
        <img
          *ngIf="authorAvatarUrl as url"
          [src]="url"
          [alt]="authorLabel"
          loading="lazy"
        />
        <span *ngIf="!authorAvatarUrl">{{ authorInitial }}</span>
      </div>
      <div class="author-meta">
        <span class="author-name">{{ authorLabel }}</span>
        <span class="created-at">{{ relativeTime }}</span>
      </div>
    </button>
    <span class="type-badge" aria-hidden="true">Track</span>
  </header>

  <!-- Tap-zone: header + track + caption + tags. Mirrors iOS
       ShareCardView.swift:116-125 — the action footer (kebab, ratings,
       reactions) is intentionally outside this region so taps on those
       controls don't also navigate. -->
  <button
    type="button"
    class="detail-tap-zone"
    (click)="openDetail()"
    [attr.aria-label]="'Open share by ' + authorLabel"
  >
    <!-- Track row: album art + metadata -->
    <div class="card-body track-body">
      <div class="track-art" *ngIf="share.albumArtUrl">
        <img [src]="share.albumArtUrl" [alt]="share.albumName || share.trackName" />
      </div>
      <div class="track-info">
        <span class="track-name" [title]="share.trackName">{{ share.trackName }}</span>
        <span class="track-artist" [title]="share.artistName">{{ share.artistName }}</span>
        <span
          class="track-album"
          *ngIf="share.albumName"
          [title]="share.albumName"
        >{{ share.albumName }}</span>
      </div>
    </div>

    <!-- Caption -->
    <p class="caption" *ngIf="share.caption">{{ share.caption }}</p>

    <!-- Mood + genre chips -->
    <div
      class="tag-row"
      *ngIf="moodLabel || genreTags.length > 0"
      aria-label="Mood and genre tags"
    >
      <span class="chip mood-chip" *ngIf="moodLabel">{{ moodLabel }}</span>
      <span class="chip genre-chip" *ngFor="let g of genreTags">{{ g }}</span>
    </div>
  </button>

  <!-- Action row: rating + reactions + comment + kebab on a single line.
       (Was three stacked rows pre-fix — felt cramped + tall.) Queue is in
       the kebab to mirror iOS; reactions bar is compact mode (smiley + pills
       only, picker pops over). -->
  <footer class="card-actions">
    <app-star-rating
      class="card-rating"
      [rating]="viewerRating"
      [readonly]="ratingPending"
      (ratingChange)="onRatingChange($event)"
    ></app-star-rating>

    <app-reactions-bar
      class="card-reactions"
      [counts]="reactionCounts"
      [viewerReactions]="viewerReactions"
      [inFlight]="reactingSlugs"
      [compact]="true"
      (toggle)="onReactionToggle($event)"
    ></app-reactions-bar>

    <button
      type="button"
      class="comment-chip"
      (click)="openDetail()"
      [attr.aria-label]="
        commentCount === 1
          ? '1 comment. Open share to view.'
          : commentCount + ' comments. Open share to view.'
      "
    >
      <svg
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path
          d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"
        />
      </svg>
      <span class="comment-count">{{ commentCount }}</span>
    </button>

    <!-- 3-dot kebab menu -->
    <div class="kebab-wrapper">
      <button
        type="button"
        class="kebab-btn"
        (click)="toggleMenu($event)"
        aria-label="More actions"
        [attr.aria-expanded]="menuOpen"
      >
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="currentColor"
          aria-hidden="true"
        >
          <circle cx="5"  cy="12" r="1.5" />
          <circle cx="12" cy="12" r="1.5" />
          <circle cx="19" cy="12" r="1.5" />
        </svg>
      </button>

      <div class="kebab-menu" *ngIf="menuOpen" role="menu">
        <button
          type="button"
          class="menu-item"
          role="menuitem"
          (click)="menuPlay()"
        >
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M8 5v14l11-7z" />
          </svg>
          Play
        </button>
        <button
          type="button"
          class="menu-item"
          role="menuitem"
          (click)="menuQueue()"
        >
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="2" />
            <line x1="12" y1="8" x2="12" y2="16" />
            <line x1="8" y1="12" x2="16" y2="12" />
          </svg>
          Add to Queue
        </button>
        <button
          type="button"
          class="menu-item"
          role="menuitem"
          (click)="menuSharePostLink()"
        >
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="18" cy="5" r="3" />
            <circle cx="6" cy="12" r="3" />
            <circle cx="18" cy="19" r="3" />
            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49" />
            <line x1="15.41" y1="6.51" x2="8.59" y2="10.49" />
          </svg>
          Share Post
        </button>
        <button
          type="button"
          class="menu-item"
          role="menuitem"
          (click)="menuOpenInSpotify()"
        >
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z" />
          </svg>
          Open in Spotify
        </button>
        <!-- Delete-share — only when the viewer is the share author.
             Mirrors iOS TrackActionsMenu owner-only delete row. -->
        <button
          type="button"
          class="menu-item menu-item-destructive"
          role="menuitem"
          *ngIf="viewerIsAuthor"
          (click)="menuDelete()"
          [disabled]="deletePending"
        >
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="3 6 5 6 21 6" />
            <path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6" />
            <path d="M10 11v6" />
            <path d="M14 11v6" />
            <path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2" />
          </svg>
          {{ deletePending ? 'Deleting...' : 'Delete share' }}
        </button>
      </div>
    </div>
  </footer>
</article>
