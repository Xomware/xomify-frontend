<div
  class="impersonation-banner"
  *ngIf="impersonatedEmail$ | async as email"
  role="status"
  aria-live="polite"
>
  <app-icon name="warning" [size]="16" class="impersonation-banner-icon"></app-icon>

  <p class="impersonation-banner-text">
    Impersonating <strong>{{ email }}</strong>
    <span
      class="impersonation-banner-note"
      *ngIf="spotifyTokenUnavailable$ | async"
    >
      &mdash; couldn't load their Spotify data (no token available) &mdash; Spotify-derived
      stats still show yours.
    </span>
  </p>

  <button
    type="button"
    class="impersonation-banner-exit"
    (click)="exit()"
    aria-label="Exit impersonation and return to Admin"
  >
    Exit impersonation
  </button>
</div>
