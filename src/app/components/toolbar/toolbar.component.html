<nav class="toolbar" [ngClass]="{ 'show-dropdown': dropdownVisible }" role="navigation" aria-label="Main navigation">
  <a routerLink="/my-profile" class="app-title" *ngIf="isLoggedIn()">
    <img
      class="logo-image"
      src="assets/img/banner-logo-x-rework.png"
      alt="Xomify home"
    />
  </a>
  <h2 class="app-title-text" *ngIf="!isLoggedIn()">
    <img
      class="logo-image"
      src="assets/img/banner-logo-x-rework.png"
      alt="Xomify"
    />
  </h2>

  <!-- Desktop nav -->
  <div class="tabs" [ngClass]="{ hidden: dropdownVisible }">
    <ng-container *ngIf="isLoggedIn()">
      <ng-container *ngFor="let entry of navEntries">
        <!-- Leaf link -->
        <a
          *ngIf="asLink(entry) as link"
          [routerLink]="link.route"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: !!link.exact }"
          [ngClass]="{ selected: isSelected(link.route) }"
          [attr.aria-current]="isSelected(link.route) ? 'page' : null"
        >
          {{ link.label }}
          <span
            class="queue-badge"
            [ngClass]="{ pending: link.badge$ === 'friends' }"
            *ngIf="link.badge$ && getBadgeCount(link) > 0"
            [attr.aria-label]="getBadgeCount(link) + ' pending'"
          >{{ getBadgeCount(link) }}</span>
        </a>

        <!-- Grouped dropdown -->
        <div
          class="nav-group"
          *ngIf="asGroup(entry) as group"
          [ngClass]="{ open: openGroupLabel === group.label }"
        >
          <button
            type="button"
            class="group-trigger"
            [ngClass]="{ selected: isGroupActive(group) }"
            [attr.aria-expanded]="openGroupLabel === group.label"
            [attr.aria-haspopup]="true"
            (click)="toggleGroup(group.label, $event)"
          >
            {{ group.label }}
            <span class="chevron" aria-hidden="true">▾</span>
            <span
              class="queue-badge"
              [ngClass]="{ pending: group.badge$ === 'friends' }"
              *ngIf="group.badge$ && getBadgeCount(group) > 0"
              [attr.aria-label]="getBadgeCount(group) + ' pending'"
            >{{ getBadgeCount(group) }}</span>
          </button>

          <div class="group-menu" role="menu" *ngIf="openGroupLabel === group.label">
            <a
              *ngFor="let link of group.links"
              [routerLink]="link.route"
              routerLinkActive="active"
              role="menuitem"
              (click)="closeGroups()"
            >
              {{ link.label }}
              <span
                class="queue-badge"
                [ngClass]="{ pending: link.badge$ === 'friends' }"
                *ngIf="link.badge$ && getBadgeCount(link) > 0"
                [attr.aria-label]="getBadgeCount(link) + ' pending'"
              >{{ getBadgeCount(link) }}</span>
            </a>
          </div>
        </div>
      </ng-container>
    </ng-container>
  </div>

  <!-- Profile avatar chip + dropdown — visible on both desktop and mobile
       when logged in. Header shows username + email, then Profile, My
       Ratings, My Favorites, Settings, Log out, and (admin only) Admin. -->
  <div class="avatar-menu-wrap" *ngIf="isLoggedIn()" [ngClass]="{ open: avatarMenuOpen }">
    <button
      type="button"
      class="avatar-chip"
      [attr.aria-expanded]="avatarMenuOpen"
      aria-haspopup="true"
      aria-label="Account menu"
      (click)="toggleAvatarMenu($event)"
    >
      <img
        class="avatar-chip-img"
        [src]="profilePicture || 'assets/img/default-avatar.png'"
        alt=""
      />
    </button>

    <div class="avatar-menu" role="menu" aria-label="Account" *ngIf="avatarMenuOpen">
      <div class="avatar-menu-header">
        <p class="avatar-menu-name">{{ displayName }}</p>
        <p class="avatar-menu-email">{{ userEmail }}</p>
      </div>

      <a routerLink="/my-profile" role="menuitem" (click)="selectAvatarItem()">Profile</a>
      <a routerLink="/ratings" role="menuitem" (click)="selectAvatarItem()">My Ratings</a>
      <a routerLink="/favorites" role="menuitem" (click)="selectAvatarItem()">My Favorites</a>
      <a routerLink="/my-profile" [queryParams]="{ tab: 'settings' }" role="menuitem" (click)="selectAvatarItem()">Settings</a>

      <div class="avatar-menu-divider" role="separator"></div>
      <button type="button" class="avatar-menu-logout" role="menuitem" (click)="logout()">Log out</button>

      <ng-container *ngIf="isAdmin">
        <div class="avatar-menu-divider" role="separator"></div>
        <a class="avatar-menu-admin" routerLink="/admin" role="menuitem" (click)="selectAvatarItem()">
          <app-icon name="settings" [size]="16"></app-icon> Admin
        </a>
      </ng-container>
    </div>
  </div>

  <!-- Dropdown Button (Mobile) -->
  <button
    class="dropdown-button"
    *ngIf="isLoggedIn()"
    (click)="toggleDropdown()"
    [attr.aria-expanded]="dropdownVisible"
    aria-controls="mobile-nav"
    aria-label="Toggle navigation menu"
  >
    <span class="hamburger" aria-hidden="true">&#9776;</span>
  </button>

  <!-- Mobile Dropdown Menu -->
  <div class="dropdown" id="mobile-nav" *ngIf="dropdownVisible" role="menu">
    <ng-container *ngFor="let entry of mobileEntries">
      <!-- Leaf link on mobile -->
      <a
        *ngIf="asLink(entry) as link"
        [routerLink]="link.route"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: !!link.exact }"
        (click)="selectItem(link.route)"
        role="menuitem"
      >
        {{ link.label }}
        <span
          class="queue-badge"
          [ngClass]="{ pending: link.badge$ === 'friends' }"
          *ngIf="link.badge$ && getBadgeCount(link) > 0"
          [attr.aria-label]="getBadgeCount(link) + ' pending'"
        >{{ getBadgeCount(link) }}</span>
      </a>

      <!-- Mobile group — render header + children flattened -->
      <div class="mobile-group" *ngIf="asGroup(entry) as group">
        <div class="mobile-group-label">{{ group.label }}</div>
        <a
          *ngFor="let link of group.links"
          [routerLink]="link.route"
          routerLinkActive="active"
          (click)="selectItem(link.route)"
          role="menuitem"
          class="mobile-group-item"
        >
          {{ link.label }}
          <span
            class="queue-badge"
            [ngClass]="{ pending: link.badge$ === 'friends' }"
            *ngIf="link.badge$ && getBadgeCount(link) > 0"
            [attr.aria-label]="getBadgeCount(link) + ' pending'"
          >{{ getBadgeCount(link) }}</span>
        </a>
      </div>
    </ng-container>
  </div>
</nav>
