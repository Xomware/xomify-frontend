<div class="scene" aria-hidden="true">
  <canvas class="layer haze"></canvas>

  <div class="deck">
    <div class="plinth">
      <span class="plinth-rim"></span>
      <span class="plinth-button plinth-button--start"></span>
      <span class="plinth-button plinth-button--speed"></span>
      <span class="plinth-button plinth-button--speed plinth-button--alt"></span>
      <span class="arm-rest"></span>
      <span class="arm-base"></span>
    </div>

    <div class="record">
      <div class="platter"></div>
      <div class="strobe"></div>
      <div class="disc"></div>
      <div class="label"></div>
      <span class="lift-shadow"></span>
      <canvas class="print"></canvas>
      <span class="spindle"></span>
      <span class="sheen"></span>
      <span class="sweep"><i></i></span>
    </div>

    <div class="arm arm--shadow">
      <div class="arm-swing">
        <span class="arm-weight"></span>
        <span class="arm-tube"></span>
        <span class="arm-head"></span>
      </div>
    </div>
    <div class="arm">
      <div class="arm-swing">
        <span class="arm-weight"></span>
        <span class="arm-tube"></span>
        <span class="arm-head"><span class="arm-lift"></span></span>
      </div>
      <span class="arm-pivot"></span>
    </div>
  </div>

  <canvas class="layer gear"></canvas>
  <div class="scrim"></div>
  <canvas class="now-playing"></canvas>
  <canvas class="stats"></canvas>
  <canvas class="lift"></canvas>
  <canvas class="layer lens"></canvas>
  <div class="vignette"></div>
  <div class="grain"></div>
</div>

<div class="mark" aria-hidden="true">
  <span class="mark-logo">
    <img
      class="logo"
      src="assets/img/banner-logo-x-rework.png"
      alt=""
      width="582"
      height="278"
      [style.--hx.px]="aim()?.x ?? 0"
      [style.--hy.px]="aim()?.y ?? 0"
      [style.--hs]="aim()?.scale ?? 1"
      [style.--ho]="aim() ? 1 : 0"
    />
    <span class="glint"><i></i></span>
  </span>
  <p class="tagline">Your Spotify year, all year.</p>
</div>

<button type="button" class="skip" aria-label="Skip intro" (click)="done.emit()">Skip</button>
