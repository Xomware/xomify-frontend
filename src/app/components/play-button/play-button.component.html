<button
  *ngIf="!isUnavailable"
  class="play-button"
  [class.small]="size === 'small'"
  [class.medium]="size === 'medium'"
  [class.large]="size === 'large'"
  [class.filled]="variant === 'filled'"
  [class.outline]="variant === 'outline'"
  [class.ghost]="variant === 'ghost'"
  [class.playing]="isPlaying"
  [class.loading]="isLoading"
  (click)="togglePlay($event)"
  [attr.aria-label]="isPlaying ? 'Pause preview' : 'Play 30-second preview'"
  [title]="isPlaying ? 'Pause preview' : 'Play 30-second preview'"
>
  <!-- Loading spinner -->
  <svg *ngIf="isLoading" class="spinner" viewBox="0 0 24 24">
    <circle
      cx="12"
      cy="12"
      r="10"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-dasharray="31.4"
      stroke-linecap="round"
    />
  </svg>

  <!-- Play icon -->
  <svg
    *ngIf="!isPlaying && !isLoading"
    class="play-icon"
    viewBox="0 0 24 24"
    fill="currentColor"
  >
    <path d="M8 5v14l11-7z" />
  </svg>

  <!-- Pause icon -->
  <svg
    *ngIf="isPlaying && !isLoading"
    class="pause-icon"
    viewBox="0 0 24 24"
    fill="currentColor"
  >
    <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
  </svg>
</button>

<!-- Unavailable: neither Spotify nor the iTunes fallback has a preview.
     A dead button is worse than no button — link out to Spotify instead. -->
<a
  *ngIf="isUnavailable"
  class="play-button-unavailable"
  [class.small]="size === 'small'"
  [class.medium]="size === 'medium'"
  [class.large]="size === 'large'"
  [href]="fallbackUrl"
  target="_blank"
  rel="noopener noreferrer"
  (click)="$event.stopPropagation()"
  aria-label="No preview available — open in Spotify"
  title="No preview available — open in Spotify"
>
  <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
    <path
      d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"
    />
  </svg>
</a>
