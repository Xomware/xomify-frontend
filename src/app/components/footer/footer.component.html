<footer class="footer" [class.footer--full]="variant === 'full'">

  <!-- Full: landing page only. Three sourced columns. -->
  <div class="footer-columns" *ngIf="variant === 'full'">
    <div class="footer-brand">
      <span class="brand-mark">XOMIFY</span>
      <p class="brand-line">Your Spotify listening, tracked and shared.</p>
      <a class="brand-back" [href]="xomwareUrl" target="_blank" rel="noopener noreferrer">
        ← Back to Xomware
      </a>
    </div>

    <nav class="footer-column" aria-labelledby="footer-apps">
      <h2 class="column-title" id="footer-apps">More from Xomware</h2>
      <ul class="column-list">
        <li *ngFor="let app of xomwareApps">
          <a [href]="app.url" target="_blank" rel="noopener noreferrer">
            {{ app.name }}
            <span class="platform-tag" *ngIf="app.platform === 'ios'">iOS</span>
          </a>
        </li>
      </ul>
    </nav>

    <nav class="footer-column" aria-labelledby="footer-repos">
      <h2 class="column-title" id="footer-repos">Source</h2>
      <ul class="column-list">
        <li *ngFor="let repo of repos">
          <a [href]="repo.url" target="_blank" rel="noopener noreferrer">{{ repo.name }}</a>
        </li>
      </ul>
    </nav>

    <nav class="footer-column" aria-labelledby="footer-social">
      <h2 class="column-title" id="footer-social">Elsewhere</h2>
      <ul class="column-list">
        <li *ngFor="let link of social">
          <a [href]="link.url" target="_blank" rel="noopener noreferrer">{{ link.name }}</a>
        </li>
      </ul>
    </nav>

    <nav class="footer-column" aria-labelledby="footer-docs">
      <h2 class="column-title" id="footer-docs">Docs</h2>
      <ul class="column-list">
        <li *ngFor="let doc of docs">
          <a [href]="doc.url" target="_blank" rel="noopener noreferrer">{{ doc.name }}</a>
        </li>
      </ul>
    </nav>
  </div>

  <!-- Slim bar pinned to the bottom of the viewport while scrolling the
       landing page. The full footer only appears once you reach the end, and
       a visitor half-way down the journey should still have somewhere to go. -->
  <div class="mini-bar" *ngIf="variant === 'full'">
    <span class="mini-brand">XOMIFY</span>
    <nav class="mini-links" aria-label="Quick links">
      <a [href]="xomwareUrl" target="_blank" rel="noopener noreferrer">Xomware</a>
      <a *ngFor="let repo of repos.slice(0, 1)" [href]="repo.url" target="_blank" rel="noopener noreferrer">Source</a>
      <a *ngFor="let link of social" [href]="link.url" target="_blank" rel="noopener noreferrer">{{ link.name }}</a>
    </nav>
  </div>

  <div class="footer-content">
    <div class="left-section">
      <span class="credit">
        <ng-container *ngIf="variant === 'full'">&copy; {{ year }} Xomware · </ng-container>
        Built by &#64;domgiordano
      </span>
    </div>

    <div class="middle-section">
      <button
        class="footer-button action-btn"
        *ngIf="showDynamicButton"
        (click)="handleDynamicButtonClick()"
      >
        {{ footerButtonText }}
      </button>
    </div>

    <!-- The compact footer keeps its single source button; the full footer
         already lists all four repos in its Source column, so repeating one
         here would be noise. -->
    <div class="right-section" *ngIf="variant === 'compact'">
      <button class="footer-button github-btn" (click)="openGitHubRepo()">
        <svg class="github-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path
            fill="currentColor"
            d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"
          />
        </svg>
        <span>View Source</span>
      </button>
    </div>
  </div>
</footer>
