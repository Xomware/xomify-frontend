<div class="page-container">
  <app-loader [loading]="loading" message="Loading feed..."></app-loader>

  <div class="feed-content" *ngIf="!loading">
    <!-- Sticky header -->
    <header class="page-header">
      <div class="header-top">
        <div>
          <h1 class="page-title">Feed</h1>
          <p class="page-subtitle">
            Shares from you and your friends
          </p>
        </div>
        <button
          class="refresh-btn"
          type="button"
          (click)="refresh()"
          [disabled]="refreshing"
          [attr.aria-busy]="refreshing"
          aria-label="Refresh feed"
          title="Refresh"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            [class.spinning]="refreshing"
            aria-hidden="true"
          >
            <path d="M23 4v6h-6M1 20v-6h6" />
            <path
              d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"
            />
          </svg>
        </button>
      </div>
    </header>

    <!-- Error -->
    <div class="feed-error" *ngIf="error && shares.length === 0" role="alert">
      <p>{{ error }}</p>
      <button class="btn-primary" type="button" (click)="refresh()">
        Try again
      </button>
    </div>

    <!-- Empty state -->
    <div
      class="empty-state"
      *ngIf="!error && shares.length === 0"
    >
      <div class="empty-icon" aria-hidden="true">
        <svg
          width="48"
          height="48"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
        </svg>
      </div>
      <h3>No shares yet</h3>
      <p>
        Follow some friends or share your Wrapped to get started.
      </p>
    </div>

    <!-- Feed list -->
    <div class="feed-list" *ngIf="shares.length > 0">
      <app-share-card
        *ngFor="let share of shares; trackBy: trackByShareId"
        [share]="share"
      ></app-share-card>
    </div>
  </div>
</div>
