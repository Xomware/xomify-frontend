<div class="page-container">
  <app-loader [loading]="loading" message="Loading feed..."></app-loader>

  <div class="feed-content" *ngIf="!loading">
    <!-- Sticky header -->
    <header class="page-header">
      <div class="header-top">
        <div>
          <h1 class="page-title">Feed</h1>
          <p class="page-subtitle">
            Shares from you and your friends
          </p>
        </div>
        <div class="header-actions">
          <button
            class="share-cta"
            type="button"
            (click)="openComposer()"
            aria-label="Create a new share"
          >
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <line x1="12" y1="5" x2="12" y2="19" />
              <line x1="5" y1="12" x2="19" y2="12" />
            </svg>
            <span>Create Share</span>
          </button>
          <button
            class="refresh-btn"
            type="button"
            (click)="refresh()"
            [disabled]="refreshing"
            [attr.aria-busy]="refreshing"
            aria-label="Refresh feed"
            title="Refresh"
          >
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              [class.spinning]="refreshing"
              aria-hidden="true"
            >
              <path d="M23 4v6h-6M1 20v-6h6" />
              <path
                d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"
              />
            </svg>
          </button>
        </div>
      </div>

      <!-- Group filter chips -->
      <div
        class="group-filter"
        *ngIf="groups.length > 0"
        role="tablist"
        aria-label="Filter feed by group"
      >
        <button
          class="chip"
          type="button"
          role="tab"
          [class.active]="activeGroupId === null"
          [attr.aria-selected]="activeGroupId === null"
          (click)="selectGroup(null)"
        >
          All Friends
        </button>
        <button
          class="chip"
          type="button"
          role="tab"
          *ngFor="let group of groups; trackBy: trackByGroupId"
          [class.active]="activeGroupId === group.id"
          [attr.aria-selected]="activeGroupId === group.id"
          (click)="selectGroup(group.id)"
        >
          {{ group.name }}
        </button>
      </div>
    </header>

    <!-- Error -->
    <div class="feed-error" *ngIf="error && shares.length === 0" role="alert">
      <p>{{ error }}</p>
      <button class="btn-primary" type="button" (click)="refresh()">
        Try again
      </button>
    </div>

    <!-- Empty state -->
    <div
      class="empty-state"
      *ngIf="!error && shares.length === 0"
    >
      <div class="empty-icon" aria-hidden="true">
        <svg
          width="48"
          height="48"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
        </svg>
      </div>
      <h3>No shares yet</h3>
      <p>
        Share a track to get started, or add friends to see what they're into.
      </p>
      <button class="btn-primary" type="button" (click)="openComposer()">
        Share a track
      </button>
    </div>

    <!-- Feed list -->
    <div class="feed-list" *ngIf="shares.length > 0">
      <app-share-card
        *ngFor="let share of shares; trackBy: trackByShareId"
        [share]="share"
        [identity]="identitiesByEmail[share.email]"
      ></app-share-card>

      <div class="load-more-row" *ngIf="nextBefore">
        <button
          type="button"
          class="btn-secondary"
          (click)="loadMore()"
          [disabled]="loadingMore"
          [attr.aria-busy]="loadingMore"
        >
          {{ loadingMore ? 'Loading...' : 'Load more' }}
        </button>
      </div>
    </div>
  </div>

  <!-- Composer modal -->
  <app-share-composer
    *ngIf="composerOpen"
    (shared)="onShareCreated($event)"
    (closed)="closeComposer()"
  ></app-share-composer>
</div>
