<nav class="quick-links" aria-label="Quick links">
  <ng-container *ngFor="let link of links">
    <a
      *ngIf="link.available"
      class="quick-link-tile"
      [routerLink]="link.route"
    >
      <span class="quick-link-icon" aria-hidden="true">
        <svg
          *ngIf="link.icon === 'shares'"
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="currentColor"
        >
          <path
            d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"
          />
        </svg>
        <svg
          *ngIf="link.icon === 'music-taste'"
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="currentColor"
        >
          <path
            d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"
          />
        </svg>
        <svg
          *ngIf="link.icon === 'favorites'"
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="currentColor"
        >
          <path
            d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
          />
        </svg>
        <svg
          *ngIf="link.icon === 'playlists'"
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="currentColor"
        >
          <path
            d="M15 6H3v2h12V6zm0 4H3v2h12v-2zM3 16h8v-2H3v2zM17 6v8.18c-.31-.11-.65-.18-1-.18-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3V8h3V6h-5z"
          />
        </svg>
      </span>
      <span class="quick-link-text">
        <span class="quick-link-label">{{ link.label }}</span>
        <span class="quick-link-description">{{ link.description }}</span>
      </span>
    </a>

    <div
      *ngIf="!link.available"
      class="quick-link-tile disabled"
      aria-disabled="true"
    >
      <span class="quick-link-icon" aria-hidden="true">
        <svg
          *ngIf="link.icon === 'favorites'"
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="currentColor"
        >
          <path
            d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
          />
        </svg>
      </span>
      <span class="quick-link-text">
        <span class="quick-link-label"
          >{{ link.label }} <span class="coming-soon-badge">Coming soon</span></span
        >
        <span class="quick-link-description">{{ link.description }}</span>
      </span>
    </div>
  </ng-container>
</nav>
