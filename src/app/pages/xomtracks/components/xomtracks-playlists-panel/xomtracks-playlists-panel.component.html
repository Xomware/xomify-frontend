<div class="xt-panel-tabs" [class.xt-panel-tabs--hidden]="open">
  <button
    type="button"
    class="xt-panel-tab xt-panel-tab--in"
    [attr.aria-expanded]="open"
    aria-controls="xt-playlists-panel"
    appTooltip="Rolling playlist of what's been shared with you"
    (click)="openFor('in')"
  >
    <span class="xt-panel-tab-icon" aria-hidden="true">♪</span>
    <span class="xt-panel-tab-label">Shared With Me</span>
  </button>
  <button
    type="button"
    class="xt-panel-tab xt-panel-tab--out"
    [attr.aria-expanded]="open"
    aria-controls="xt-playlists-panel"
    appTooltip="Rolling playlist of what you've shared out"
    (click)="openFor('out')"
  >
    <span class="xt-panel-tab-icon" aria-hidden="true">♪</span>
    <span class="xt-panel-tab-label">Shared By Me</span>
  </button>
</div>

<div
  class="xt-panel-scrim"
  *ngIf="open"
  (click)="onBackdropClick($event)"
  (keydown)="onKeydown($event)"
>
  <aside
    #panel
    id="xt-playlists-panel"
    class="xt-panel-drawer"
    role="dialog"
    aria-modal="true"
    aria-labelledby="xt-playlists-panel-title"
    tabindex="-1"
  >
    <header class="xt-panel-head" [class.xt-panel-head--out]="requestedDirection === 'out'">
      <div>
        <span class="xt-panel-eyebrow">Rolling</span>
        <h2 class="xt-panel-title" id="xt-playlists-panel-title">
          {{ requestedTitle || (requestedDirection === 'out' ? 'Shared By Me' : 'Shared With Me') }}
        </h2>
      </div>
      <button type="button" class="xt-panel-close" (click)="close()" aria-label="Close playlist">
        <span aria-hidden="true">×</span>
      </button>
    </header>

    <div class="xt-panel-body">
      <!-- Loading -->
      <div class="xt-panel-state" *ngIf="state === 'loading'" aria-busy="true">
        <p>Loading playlists…</p>
      </div>

      <!-- Error -->
      <div class="xt-panel-state xt-panel-state--error" *ngIf="state === 'error'" role="alert">
        <p>Couldn't load the playlists.</p>
        <button type="button" class="xt-panel-retry-btn" (click)="retry()">Try again</button>
      </div>

      <!-- Empty (rare — neither baseline nor own has a playlist yet) -->
      <div class="xt-panel-state" *ngIf="requestedEmpty">
        <p>No rolling playlist here yet.</p>
      </div>

      <!-- Loaded -->
      <ng-container *ngIf="state === 'loaded'">
        <article
          class="xt-playlist"
          *ngFor="let card of requestedCards"
          [attr.data-direction]="requestedDirection"
          [attr.data-scope]="card.scope"
        >
          <span class="xt-playlist-scope-badge" *ngIf="requestedCards.length > 1">{{ card.label }}</span>
          <p class="xt-playlist-blurb">{{ card.blurb }}</p>
          <iframe
            class="xt-playlist-embed"
            [src]="card.embedUrl"
            [title]="requestedTitle + ' — ' + card.label + ' — Spotify embed'"
            width="100%"
            height="352"
            frameborder="0"
            loading="lazy"
            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
          ></iframe>
          <a class="xt-playlist-open" [href]="card.openUrl" target="_blank" rel="noopener noreferrer">
            Open in Spotify
            <span aria-hidden="true">↗</span>
          </a>
        </article>
      </ng-container>
    </div>
  </aside>
</div>
