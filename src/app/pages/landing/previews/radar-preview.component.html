<div class="preview-card">
  <div class="preview-head">
    <span class="preview-title">Release Radar</span>
    <span class="preview-chip">This week</span>
  </div>

  <div class="calendar">
    <div class="day-column" *ngFor="let day of days; let i = index">
      <span class="day-label">{{ day }}</span>
      <div class="day-slot">
        <div class="release" *ngFor="let release of releasesFor(i)">
          <app-preview-art class="release-art" [art]="release.art" [label]="release.title"></app-preview-art>
          <span class="release-title">{{ release.title }}</span>
          <span class="release-kind">{{ release.kind }}</span>
        </div>
      </div>
    </div>
  </div>
</div>
