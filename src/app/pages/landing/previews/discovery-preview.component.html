<div class="tiles">
  <div class="tile" *ngFor="let tile of tiles">
    <img class="tile-art" [src]="tile.cover" [alt]="tile.label" loading="lazy" />
    <span class="tile-text">
      <span class="tile-label">{{ tile.label }}</span>
      <span class="tile-detail">{{ tile.detail }}</span>
    </span>
  </div>
</div>
