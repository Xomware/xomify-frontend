version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    # Ignore major version bumps for Angular — must be upgraded as a group
    ignore:
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular-devkit/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "swiper"
        update-types: ["version-update:semver-major"]
      # Angular 18's peer range is >=5.4 <5.6, so MINOR bumps are the ones that
      # break the build -- 5.5.4 -> 5.9.3 is a minor, and it is what broke CI in
      # #188. Ignoring only majors did nothing, because TypeScript has not
      # shipped a major since 1.0. Patches within 5.5.x are still allowed.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
