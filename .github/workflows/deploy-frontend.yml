name: Deploy Xomify Frontend

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: Xomware/github-actions/.github/workflows/deploy-frontend-s3.yml@v1
    with:
      app: xomify
      node-version: '18'
      install-command: npm install
      ssm: |
        API_ID=/xomify/api/API_ID
      build-command: |
        f=src/environments/environment.ts
        sed -i "s|spotifyClientId: '---'|spotifyClientId: '$CLIENT_ID'|" $f
        sed -i "s|apiAuthToken: '---'|apiAuthToken: '$API_ACCESS_TOKEN'|" $f
        sed -i "s|apiId: '---'|apiId: '$API_ID'|" $f
        if grep -nE "(spotifyClientId|apiAuthToken|apiId): *'(---)?'" $f; then
          echo "::error::environment.ts still has placeholder credentials"
          exit 1
        fi
        npm run build:prod
      dist-dir: dist/xomify
      bucket: xomify.xomware.com
      domain: xomify.xomware.com

  # S3 guesses a binary type for the extensionless AASA file. Universal Links need it served
  # as JSON and never cached, so it's re-uploaded after the shared deploy.
  aasa:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Xomware/github-actions/actions/load-infisical-secrets@v1
        with:
          path: /xomify
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_FRONTEND_ROLE_ARN }}
          aws-region: us-east-1
      - run: |
          set -euo pipefail
          aws s3 cp src/.well-known/apple-app-site-association \
            s3://xomify.xomware.com/.well-known/apple-app-site-association \
            --content-type application/json --cache-control 'no-cache, no-store, must-revalidate'
          id=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Aliases.Items && contains(Aliases.Items, 'xomify.xomware.com')].Id" --output text)
          aws cloudfront create-invalidation --distribution-id "$id" --paths /.well-known/apple-app-site-association > /dev/null

  release:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(node -p "require('./package.json').version")
          gh release create "v$v" --title "Release v$v" \
            --notes "Deployed to production from $GITHUB_SHA." \
            || echo "Release v$v already exists, skipping."
